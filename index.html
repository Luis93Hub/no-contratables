<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Los Pro</title>
  <!-- Font Awesome (iconos) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="card" role="main">
  <!-- HEADER -->
  <header class="header">
    <!-- Imagen del micrófono -->
    <img src="mic.jpg" alt="Micrófono de estudio" class="header-bg" />
    
    <!-- Contenido del header (título y slogan) -->
    <div class="header-content">
      <div class="band-title">
        <h1>Music and <span>Rejoicing</span></h1>
      </div>
      <div class="slogan">
        <i class="fas fa-bread-slice"></i> Immeasurable God
      </div>
    </div>
  </header>

  <!-- GRID DE CANCIONES -->
  <div class="song-grid" id="songGrid">
    <!-- Las canciones se generan con JS -->
  </div>

  <!-- FOOTER -->
  <footer class="footer-note">
    <div class="copy">
      <i class="fas fa-guitar"></i> · Los Pro · 2026
    </div>
  </footer>
</div>

<script src="script.js"></script>
</body>
</html>
