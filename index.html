<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Los No Contratables · tocamos por un pedazo de pan</title>
  <!-- Font Awesome (iconos) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="card" role="main">
  <!-- HEADER -->
  <header class="header">
    <div class="band-title">
      <h1>Los No <span>Contratables</span></h1>
    </div>
    <div class="slogan">
      <i class="fas fa-bread-slice"></i> tocamos por un pedazo de pan
    </div>
  </header>

  <!-- GRID DE CANCIONES -->
  <div class="song-grid" id="songGrid">
    <!-- cada canción se genera con JS -->
  </div>

  <!-- FOOTER -->
  <footer class="footer-note">
    <div class="copy">
      <i class="fas fa-guitar"></i> · Los No Contratables · 2026
    </div>
    <div class="social">
      <a href="#" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
      <a href="#" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
      <a href="#" aria-label="Spotify"><i class="fab fa-spotify"></i></a>
      <a href="#" aria-label="YouTube"><i class="fab fa-youtube"></i></a>
    </div>
  </footer>
</div>

<script src="script.js"></script>
</body>
</html>
